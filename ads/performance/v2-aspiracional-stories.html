<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1080px; height:1920px;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  overflow:hidden; position:relative;
  background:#FF6B35;
  display:flex; flex-direction:column;
}

/* Dark bottom half */
.bg-split {
  position:absolute; bottom:0; left:0; right:0;
  height:820px;
  background:#080808;
  clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 100%);
}

/* Orange glow on dark */
.glow {
  position:absolute; bottom:200px; left:50%;
  transform:translateX(-50%);
  width:600px; height:300px;
  background:radial-gradient(ellipse, rgba(255,107,53,0.3) 0%, transparent 70%);
  pointer-events:none;
}

/* Top */
.topbar {
  position:relative; z-index:10;
  padding:80px 64px 0;
  display:flex; align-items:center; justify-content:space-between;
}
.logo { display:flex; align-items:center; gap:14px; }
.logo-icon {
  width:52px; height:52px; background:rgba(0,0,0,0.2);
  border-radius:13px; display:flex; align-items:center; justify-content:center;
}
.logo-icon span { font-size:26px; font-weight:900; color:#fff; }
.logo-name { font-size:24px; font-weight:900; color:#fff; letter-spacing:4px; }
.tag {
  background:rgba(0,0,0,0.2); color:#fff;
  border-radius:50px; padding:10px 22px;
  font-size:14px; font-weight:700;
}

/* Center hero */
.hero {
  flex:0.9; position:relative; z-index:10;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:0 64px;
  text-align:center;
}

.eyebrow {
  font-size:15px; font-weight:800; color:rgba(255,255,255,0.7);
  letter-spacing:3px; text-transform:uppercase; margin-bottom:32px;
}

/* Big transformation numbers */
.transform {
  display:flex; align-items:center; gap:24px;
  margin-bottom:44px;
}
.t-box {
  background:rgba(0,0,0,0.2); border-radius:20px;
  padding:24px 36px; text-align:center;
}
.t-box.after { background:#fff; }
.t-num { font-size:60px; font-weight:900; color:rgba(255,255,255,0.6); letter-spacing:-3px; }
.t-box.after .t-num { color:#FF6B35; }
.t-lbl { font-size:13px; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:1px; }
.t-box.after .t-lbl { color:rgba(255,107,53,0.6); }
.arrow-big {
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.arrow-big svg { width:60px; }
.arrow-big span { font-size:13px; font-weight:700; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:1px; }

.hook {
  font-size:96px; font-weight:900; color:#fff;
  line-height:0.92; letter-spacing:-4px;
  margin-bottom:32px;
}
.hook em { color:#080808; font-style:normal; }

.sub {
  font-size:28px; font-weight:500; color:rgba(255,255,255,0.8);
  line-height:1.45;
}
.sub strong { color:#fff; font-weight:800; }

/* Bottom proof + CTA */
.bottom {
  position:relative; z-index:10;
  padding:0 64px 90px;
  display:flex; flex-direction:column; gap:24px;
}

.proof-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:14px;
}
.proof-item {
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:18px; padding:24px 24px;
}
.proof-val { font-size:36px; font-weight:900; color:#fff; letter-spacing:-1px; }
.proof-val em { color:#FF6B35; font-style:normal; }
.proof-lbl { font-size:13px; font-weight:600; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:1px; margin-top:4px; }

.cta-btn {
  background:#FF6B35; border-radius:24px;
  padding:36px 44px;
  display:flex; align-items:center; justify-content:space-between;
}
.cta-main { font-size:36px; font-weight:900; color:#fff; letter-spacing:-1px; }
.cta-sub { font-size:17px; font-weight:600; color:rgba(255,255,255,0.75); margin-top:6px; }
.wa-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
.wa-icon {
  background:#fff; border-radius:50%;
  width:70px; height:70px;
  display:flex; align-items:center; justify-content:center;
}
.wa-icon svg { width:40px; }
.wa-num { font-size:18px; font-weight:900; color:#fff; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="bg-split"></div>
  <div class="glow"></div>

  <div class="topbar">
    <div class="logo">
      <div class="logo-icon"><span>Z</span></div>
      <span class="logo-name">ZUBA</span>
    </div>
    <span class="tag">Caso real · CDMX</span>
  </div>

  <div class="hero">
    <p class="eyebrow">Resultado real · Sin pauta</p>

    <div class="transform">
      <div class="t-box">
        <div class="t-num">3.8★</div>
        <div class="t-lbl">Antes</div>
      </div>
      <div class="arrow-big">
        <svg viewBox="0 0 60 24" fill="none">
          <path d="M0 12 H48" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <path d="M40 4 L52 12 L40 20" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="t-box after">
        <div class="t-num">4.7★</div>
        <div class="t-lbl">Después</div>
      </div>
    </div>

    <h1 class="hook">
      De invisible<br>a <em>Top 3.</em>
    </h1>
    <p class="sub">
      Optimizamos tu operación.<br>
      El algoritmo <strong>trabaja para ti.</strong>
    </p>
  </div>

  <div class="bottom">
    <div class="proof-grid">
      <div class="proof-item">
        <div class="proof-val"><em>×3</em></div>
        <div class="proof-lbl">Conversión foto HD</div>
      </div>
      <div class="proof-item">
        <div class="proof-val">Top<em>3</em></div>
        <div class="proof-lbl">Sin invertir en ads</div>
      </div>
    </div>
    <div class="cta-btn">
      <div>
        <div class="cta-main">Escríbenos gratis →</div>
        <div class="cta-sub">Auditoría 20 min · Sin compromiso</div>
      </div>
      <div class="wa-wrap">
        <div class="wa-icon">
          <svg viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="18" fill="#25D366"/>
            <path d="M26.5 21.8c-.4-.2-2.3-1.1-2.6-1.2-.4-.1-.6-.2-.9.2-.3.4-1 1.2-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-2-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.5-.7.2-.2.2-.4.3-.7.1-.3 0-.6-.1-.8-.1-.2-.9-2.1-1.2-2.9-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1 .5-.4.4-1.4 1.3-1.4 3.2s1.4 3.7 1.6 3.9c.2.3 2.8 4.2 6.8 5.9 4 1.6 4 1.1 4.7 1 .7-.1 2.3-.9 2.6-1.8.3-.9.3-1.6.2-1.8-.1-.1-.3-.2-.6-.3z" fill="white"/>
          </svg>
        </div>
        <span class="wa-num">564 292 6243</span>
      </div>
    </div>
  </div>
</body>
</html>
